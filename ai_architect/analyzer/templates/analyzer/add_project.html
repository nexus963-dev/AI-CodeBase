<script>
        // Form validation logic for enabling/disabling submit button
        const projectNameInput = document.getElementById('project-name');
        const repoInput = document.getElementById('repo-url');
        const analyzeBtn = document.getElementById('analyze-btn');

        function validateForm() {
            const projectName = projectNameInput.value.trim();
            const repoUrl = repoInput.value.trim();

            // Enable button only if both required fields are non-empty
            if (projectName.length > 0 && repoUrl.length > 0) {
                analyzeBtn.disabled = false;
                analyzeBtn.classList.remove('opacity-50', 'grayscale');
            } else {
                analyzeBtn.disabled = true;
                analyzeBtn.classList.add('opacity-50', 'grayscale');
            }
        }

        // Add input event listeners to both required fields
        projectNameInput.addEventListener('input', validateForm);
        repoInput.addEventListener('input', validateForm);

        // Add micro-interaction to form inputs
        const inputs = document.querySelectorAll('input, select');
        inputs.forEach(input => {
            input.addEventListener('focus', () => {
                input.parentElement.classList.add('scale-[1.01]');
                input.parentElement.style.transition = 'transform 0.2s ease-out';
            });
            input.addEventListener('blur', () => {
                input.parentElement.classList.remove('scale-[1.01]');
            });
        });
    </script>
